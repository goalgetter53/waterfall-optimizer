[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waterfall-optimizer"
version = "0.1.0"
description = "Self-hostable contact-enrichment orchestrator that learns which data provider to call first per segment to minimise cost per verified email."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hussain Singapuri", email = "Hussainsingapuri24@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.scripts]
wfo = "wfo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wfo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = ["postgres: requires WFO_PG_DSN"]
filterwarnings = ["ignore:Using `httpx` with"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["wfo"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true
